[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "certiphy-ai"
version = "0.1.0"
description = "MCP server for EU AI Act compliance evaluation of physical AI systems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp",
    "anthropic",
    "pydantic",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
governance-mcp = "governance_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/governance_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
